name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pyyaml

      - name: 语法编译检查
        run: python -m compileall -q bot tools tests

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 工作流模板与人设同步性
        run: python tools/sync_persona_to_workflows.py --check

      - name: 人设体检
        run: python tools/lint_persona.py --strict

      - name: 批处理脚本编码检查（GBK + CRLF，且与生成器一致）
        run: python tools/make_cmd.py --check

      - name: 密钥扫描
        shell: bash
        run: |
          set -e
          if git grep -nIE "sk-[A-Za-z0-9]{16,}" -- . ':!README.md'; then
            echo "::error::仓库里出现了疑似真实 API Key"
            exit 1
          fi
          if git grep -nI -e "BEGIN .*PRIVATE KEY" -- .; then
            echo "::error::仓库里出现了私钥"
            exit 1
          fi
          # config/ 下的口令类字段必须是 \${占位符}，不能是写死的值。
          # 只扫 config/，避免误伤 tests/ 里"断言它不存在"的字符串。
          if git grep -nIE '(access_token|"token"|apikey|api_key|secret_key)\s*[:=]\s*"?[A-Za-z0-9_@.-]{8,}' -- config/; then
            echo "::error::config/ 里出现了疑似写死的密钥/口令，应改用 \${...} 占位符"
            exit 1
          fi
          echo "未发现密钥"

      - name: 配置文件可解析
        shell: bash
        run: |
          python -c "import yaml,glob,sys;[yaml.safe_load(open(f,encoding='utf-8')) for f in glob.glob('config/*.yaml')];print('yaml ok')"
          python -c "import json,glob;[json.load(open(f,encoding='utf-8')) for f in glob.glob('config/**/*.json',recursive=True)];print('json ok')"
