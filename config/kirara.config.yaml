ims:
- name: qq_onebot
  enable: true
  adapter: onebot
  config:
    websocket_url: /im/websocket/onebot/kirara01/ws
    access_token: KiraraQQ2026
    heartbeat_interval: 15
# http_legacy 适配器：提供 POST http://127.0.0.1:8080/v1/chat 测试通道，
# bot/selftest.py 靠它在「QQ 还没扫码登录」时做端到端自测。
# 它只跟随 web.host 绑定在 127.0.0.1，不对外暴露。不需要自测可以把 enable 改成 false。
- name: test_http
  enable: true
  adapter: http_legacy
  config: {}
llms:
  api_backends:
  - name: deepseek
    adapter: DeepSeek
    config:
      # 安装时由 bot/provision.py 用 .env 里的 DEEPSEEK_API_KEY 替换，切勿把真实 key 提交进仓库
      api_key: ${DEEPSEEK_API_KEY}
      api_base: https://api.deepseek.com/v1
    enable: true
    models:
    - deepseek-flash                      # 便宜：工具决策、群聊
    - deepseek-v4-pro                     # 复杂推理备用
    - deepseek-v4-flash-vision-exp        # 视觉：看懂表情包（思考模型，max_tokens 别给太小）
defaults:
  # 上游模板这里写的是 gemini-1.5-flash（并不存在的后端），会导致未指定模型的块报错，已纠正
  llm_model: deepseek-flash
memory:
  persistence:
    type: file
    file:
      storage_dir: ./data/memory
    redis:
      host: localhost
      port: 6379
      db: 0
  max_entries: 100
  default_scope: member
web:
  host: 127.0.0.1
  port: 8080
  secret_key: ''
  password_file: ./data/web/password.hash
plugins:
  enable:
  - im_onebot_adapters
  - chatgpt-mirai-qq-bot-web-search
  - web_search
  - chatgpt-mirai-qq-bot-scheduler
  - chatgpt-mirai-qq-bot-api-collection
  - scheduler
  - api_collection
  market_base_url: https://kirara-plugin.app.lss233.com/api/v1
update:
  pypi_registry: https://pypi.org/simple
  npm_registry: https://registry.npmjs.org
frpc:
  enable: false
  server_addr: ''
  server_port: 7000
  token: ''
  remote_port: 0
system:
  timezone: Asia/Shanghai
tracing:
  llm_tracing_content: false
